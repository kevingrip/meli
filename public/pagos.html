<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" type="text/css" href="./styles.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body style="background-color: blueviolet;">
    <h1 style="display: flex; justify-content: center; align-items: center; margin:30px;">Pagos</h1>

    <!-- Contenedor solo para botones -->
    <div id="filtros" style="display:flex; justify-content:center; margin-bottom:20px;"></div>

    <!-- Contenedor para resultados -->
    <div id="ordenes"></div>

    <div style="display: flex; justify-content: center; align-items: center" id="cargando">
        <h3>Cargando...</h3>
    </div>

    <script type="module">
        const ordenes = document.getElementById('ordenes')
        const filtros = document.getElementById('filtros')
        const cargando = document.getElementById('cargando')

        const createButton = (nombre) => {
            const button = document.createElement('button')
            button.textContent = nombre
            return button
        }

        const constructor = (divPadre, variable) => {
            const div = document.createElement('div')
            div.textContent = variable
            div.classList.add('divSubPagos')
            divPadre.appendChild(div)
        }

        const createTitles = () => {
            const divTitulo = document.createElement('div')
            const cols = ['Dia', 'Fecha', 'Mes', 'Zona', 'Envio', 'Precio ML', 'Pago', 'Cuenta', 'Venta ID', 'Producto', 'Semana']

            cols.forEach(c => constructor(divTitulo, c))

            divTitulo.classList.add("divPagos")
            divTitulo.style.backgroundColor = 'cyan'
            divTitulo.style.fontWeight = 'bold'
            ordenes.appendChild(divTitulo)
        }

        const createDivPrecioTotal = (precioTotal) => {
            const div = document.createElement('div')
            div.textContent = `Total: $${precioTotal}`
            div.style.fontWeight = 'bold'
            div.classList.add('divTotalPagos')
            ordenes.appendChild(div)
        }

        const obtenerSemanaISO = (fecha) => {
            const date = new Date(fecha)
            date.setHours(0, 0, 0, 0)
            date.setDate(date.getDate() + 3 - ((date.getDay() + 6) % 7))
            const semana1 = new Date(date.getFullYear(), 0, 4)

            return 1 + Math.round(((date - semana1) / 86400000 -
                3 + ((semana1.getDay() + 6) % 7)) / 7)
        }

        ['TODAS', 'VERGUI', 'PLEX', 'KEVIN'].forEach(nombre => {
            const btn = createButton(nombre)
            filtros.appendChild(btn)

            btn.addEventListener('click', () => {

                Array.from(filtros.children).forEach(b => b.style.backgroundColor = '')
                btn.style.backgroundColor = 'violet'

                cargando.style.display = 'flex'
                ordenes.innerHTML = ''

                const filtroEnvio = nombre === 'TODAS' ? 'null' : nombre

                fetch(`/api/pagos/${filtroEnvio}`)
                    .then(r => r.json())
                    .then(result => {

                        cargando.style.display = 'none'
                        createTitles()

                        // 👉 CLAVE: crear año + semana
                        result.forEach(e => {
                            const fecha = new Date(e.fechaEntrega)
                            e.anio = fecha.getFullYear()
                            e.semana = obtenerSemanaISO(fecha)
                            e.clave = `${e.anio}-${e.semana}`
                        })

                        // 👉 ordenar por fecha real
                        result.sort((a, b) => new Date(a.fechaEntrega) - new Date(b.fechaEntrega))

                        // 👉 lista única correcta (AÑO + SEMANA)
                        const semanas = [...new Set(result.map(e => e.clave))]

                        let index = semanas.length - 1

                        const render = (i) => {

                            ordenes.innerHTML = ''
                            createTitles()

                            const clave = semanas[i]
                            let total = 0

                            result
                                .filter(e => e.clave === clave)
                                .forEach(e => {

                                    const div = document.createElement('div')

                                    constructor(div, e.dia)
                                    constructor(div, new Date(e.fechaEntrega).toLocaleDateString('es-AR'))
                                    constructor(div, e.mes)
                                    constructor(div, e.zona)
                                    constructor(div, e.envio)
                                    constructor(div, e.precio)
                                    constructor(div, e.pago)
                                    constructor(div, e.seller)
                                    constructor(div, e.ventaid)
                                    constructor(div, e.producto)
                                    constructor(div, e.semana)

                                    div.classList.add("divPagos")
                                    ordenes.appendChild(div)

                                    total += e.pago
                                })

                            createDivPrecioTotal(total)

                            const nav = document.createElement('div')
                            nav.style.display = 'flex'
                            nav.style.justifyContent = 'center'
                            nav.style.gap = '20px'

                            if (i > 0) {
                                const ant = createButton('ant')
                                ant.onclick = () => render(i - 1)
                                nav.appendChild(ant)
                            }

                            if (i < semanas.length - 1) {
                                const sig = createButton('sig')
                                sig.onclick = () => render(i + 1)
                                nav.appendChild(sig)
                            }

                            ordenes.appendChild(nav)
                        }

                        render(index)

                    })
                    .catch(err => {
                        cargando.style.display = 'none'
                        console.error(err)
                    })
            })
        })

        filtros.querySelector('button').click()
    </script>
</body>


</html>
